<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 测试页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .panel { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .panel h2 { margin-bottom: 15px; color: #555; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; font-size: 14px; margin-right: 10px; margin-bottom: 10px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }
        .status { display: inline-block; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.connected { background: #d4edda; color: #155724; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        .status.connecting { background: #fff3cd; color: #856404; }
        .log { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 10px; height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px; }
        .log-entry { margin-bottom: 8px; padding: 5px; border-radius: 3px; }
        .log-entry.sent { background: #e3f2fd; color: #0d47a1; }
        .log-entry.received { background: #f3e5f5; color: #4a148c; }
        .log-entry.system { background: #fff3e0; color: #e65100; }
        .log-entry.error { background: #ffebee; color: #c62828; }
        .log-time { color: #999; font-size: 11px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .stat-item { background: #f8f9fa; padding: 15px; border-radius: 4px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #007bff; }
        .stat-label { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket 测试页面</h1>
        <div class="panel">
            <h2>连接配置</h2>
            <div class="form-group">
                <label>服务器地址</label>
                <input type="text" id="serverUrl" value="ws://localhost:3000" placeholder="ws://localhost:3000">
            </div>
            <div class="form-group">
                <label>JWT Token (可选)</label>
                <input type="text" id="jwtToken" placeholder="输入登录后获取的 Token">
            </div>
            <div>
                <button id="btnConnect" class="success">连接</button>
                <button id="btnDisconnect" class="danger" disabled>断开</button>
                <span id="connectionStatus" class="status disconnected">未连接</span>
            </div>
        </div>
        <div class="panel">
            <h2>连接统计</h2>
            <div class="stats">
                <div class="stat-item"><div class="stat-value" id="statConnected">0</div><div class="stat-label">连接次数</div></div>
                <div class="stat-item"><div class="stat-value" id="statSent">0</div><div class="stat-label">发送消息</div></div>
                <div class="stat-item"><div class="stat-value" id="statReceived">0</div><div class="stat-label">接收消息</div></div>
                <div class="stat-item"><div class="stat-value" id="statLatency">-</div><div class="stat-label">延迟 (ms)</div></div>
            </div>
        </div>
        <div class="panel">
            <h2>测试操作</h2>
            <button id="btnPing" disabled>发送 Ping</button>
            <button id="btnSubscribeDevice" disabled>订阅设备 (DEV001)</button>
            <button id="btnUnsubscribeDevice" disabled>取消订阅设备</button>
            <button id="btnSubscribeAlarm" disabled>订阅告警</button>
            <button id="btnSendMessage" disabled>发送测试消息</button>
            <button id="btnClearLog">清空日志</button>
        </div>
        <div class="panel">
            <h2>消息日志</h2>
            <div class="log" id="messageLog"></div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let stats = { connected: 0, sent: 0, received: 0 };
        const serverUrl = document.getElementById('serverUrl');
        const jwtToken = document.getElementById('jwtToken');
        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const connectionStatus = document.getElementById('connectionStatus');
        const messageLog = document.getElementById('messageLog');

        function updateStats() {
            document.getElementById('statConnected').textContent = stats.connected;
            document.getElementById('statSent').textContent = stats.sent;
            document.getElementById('statReceived').textContent = stats.received;
        }

        function addLog(type, message) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            messageLog.appendChild(entry);
            messageLog.scrollTop = messageLog.scrollHeight;
        }

        function updateStatus(status, text) {
            connectionStatus.className = `status ${status}`;
            connectionStatus.textContent = text;
        }

        function updateButtonState(connected) {
            btnConnect.disabled = connected;
            btnDisconnect.disabled = !connected;
            ['btnPing', 'btnSubscribeDevice', 'btnUnsubscribeDevice', 'btnSubscribeAlarm', 'btnSendMessage'].forEach(id => {
                document.getElementById(id).disabled = !connected;
            });
        }

        btnConnect.addEventListener('click', () => {
            const url = serverUrl.value;
            const token = jwtToken.value;
            updateStatus('connecting', '连接中...');
            addLog('system', `正在连接到 ${url}...`);

            const options = { transports: ['websocket'], autoConnect: true };
            if (token) options.auth = { token };

            socket = io(url, options);

            socket.on('connect', () => {
                updateStatus('connected', '已连接');
                updateButtonState(true);
                stats.connected++;
                updateStats();
                addLog('system', `连接成功! Socket ID: ${socket.id}`);
            });

            socket.on('disconnect', (reason) => {
                updateStatus('disconnected', '已断开');
                updateButtonState(false);
                addLog('system', `连接断开: ${reason}`);
            });

            socket.on('connect_error', (error) => {
                updateStatus('disconnected', '连接错误');
                addLog('error', `连接错误: ${error.message}`);
            });

            socket.on('connected', (data) => addLog('received', `服务器确认: ${JSON.stringify(data, null, 2)}`));
            socket.on('pong', (data) => {
                const latency = Date.now() - data.timestamp;
                document.getElementById('statLatency').textContent = latency;
                addLog('received', `Pong 延迟: ${latency}ms`);
                stats.received++; updateStats();
            });
            socket.on('device:data', (data) => { addLog('received', `设备数据: ${JSON.stringify(data, null, 2)}`); stats.received++; updateStats(); });
            socket.on('alarm:new', (data) => { addLog('received', `告警: ${JSON.stringify(data, null, 2)}`); stats.received++; updateStats(); });
            socket.on('subscribed:device', (data) => addLog('received', `订阅设备确认: ${JSON.stringify(data, null, 2)}`));
            socket.on('unsubscribed:device', (data) => addLog('received', `取消订阅设备确认: ${JSON.stringify(data, null, 2)}`));
            socket.on('subscribed:alarm', (data) => addLog('received', `订阅告警确认: ${JSON.stringify(data, null, 2)}`));
            socket.on('broadcast', (data) => { addLog('received', `广播消息: ${JSON.stringify(data, null, 2)}`); stats.received++; updateStats(); });
        });

        btnDisconnect.addEventListener('click', () => { if (socket) { socket.disconnect(); socket = null; } });
        document.getElementById('btnPing').addEventListener('click', () => {
            if (socket) { const ts = Date.now(); socket.emit('ping', { timestamp: ts }); addLog('sent', `Ping: ${ts}`); stats.sent++; updateStats(); }
        });
        document.getElementById('btnSubscribeDevice').addEventListener('click', () => {
            if (socket) { socket.emit('subscribe:device', 'DEV001'); addLog('sent', '订阅设备: DEV001'); stats.sent++; updateStats(); }
        });
        document.getElementById('btnUnsubscribeDevice').addEventListener('click', () => {
            if (socket) { socket.emit('unsubscribe:device', 'DEV001'); addLog('sent', '取消订阅设备: DEV001'); stats.sent++; updateStats(); }
        });
        document.getElementById('btnSubscribeAlarm').addEventListener('click', () => {
            if (socket) { socket.emit('subscribe:alarm'); addLog('sent', '订阅告警'); stats.sent++; updateStats(); }
        });
        document.getElementById('btnSendMessage').addEventListener('click', () => {
            if (socket) { const msg = { type: 'test', content: 'Hello from client', timestamp: Date.now() }; socket.emit('message', msg); addLog('sent', `发送消息: ${JSON.stringify(msg, null, 2)}`); stats.sent++; updateStats(); }
        });
        document.getElementById('btnClearLog').addEventListener('click', () => { messageLog.innerHTML = ''; });
    </script>
</body>
</html>
